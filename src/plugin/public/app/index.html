      不引 Google Fonts：桌面端/内网常把 fonts.googleapis.com 挂死，这个 render-blocking
      stylesheet 会把首屏拖到 17s+（2026-10-28 实测 17363ms）。CSS 里 font-family 已是
      var(--font-inter), "Inter", "PingFang SC", sans-serif 这种带系统回退的栈，
      去掉网络字体只影响字形细节，不影响可用性。
    -->
    <style>
      /* next/font 在 H5 的等价物：只留变量名，字体本体走系统栈（无网络依赖） */
      :root {
        --font-inter: 'Inter';
        --font-jetbrains-mono: 'JetBrains Mono';
      }
    </style>
