<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Superman</title>
<style>
  :root { color-scheme: light dark; }
  body {
    margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
    font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Segoe UI', sans-serif;
    background: linear-gradient(160deg, #0f172a, #1e293b); color: #e2e8f0;
  }
  .card {
    width: min(420px, 88vw); padding: 28px 24px; border-radius: 20px;
    background: rgba(255, 255, 255, .06); border: 1px solid rgba(255, 255, 255, .12);
    backdrop-filter: blur(18px); box-shadow: 0 18px 50px rgba(0, 0, 0, .35);
  }
  h1 { font-size: 22px; margin: 0 0 4px; }
  .sub { font-size: 13px; color: #94a3b8; margin-bottom: 18px; }
  .row { display: flex; justify-content: space-between; font-size: 13px; padding: 8px 0; border-top: 1px solid rgba(255,255,255,.08); }
  .ok { color: #4ade80; } .bad { color: #f87171; } .dim { color: #94a3b8; }
  input, button {
    width: 100%; box-sizing: border-box; margin-top: 8px; padding: 10px 12px; font-size: 14px;
    border-radius: 10px; border: 1px solid rgba(255,255,255,.15); background: rgba(255,255,255,.08); color: inherit;
  }
  button { cursor: pointer; background: rgba(96, 165, 250, .25); border-color: rgba(96, 165, 250, .4); }
  button:hover { background: rgba(96, 165, 250, .35); }
  #login { display: none; margin-top: 16px; }
  #msg { font-size: 12px; margin-top: 8px; min-height: 16px; }
</style>
</head>
<body>
<div class="card">
  <h1>🦸 Superman</h1>
  <div class="sub">DSH 插件骨架 · K1 — host 半运行中</div>
  <div class="row"><span class="dim">/s/api/health</span><span id="health">…</span></div>
  <div class="row"><span class="dim">会话</span><span id="session">…</span></div>
  <div class="row"><span class="dim">最近心跳</span><span id="heartbeat" class="dim">需登录</span></div>
  <div id="apis" class="dim" style="font-size:11px;margin-top:14px;line-height:1.8"></div>
  <div id="login">
    <input id="u" placeholder="用户名" autocomplete="username" />
    <input id="p" type="password" placeholder="密码" autocomplete="current-password" />
    <button id="btn">登录（dev）</button>
    <div id="msg"></div>
  </div>
</div>
<script>
  var $ = function (id) { return document.getElementById(id) }
  function tickHealth() {
    fetch('/s/api/health').then(function (r) { return r.json() }).then(function (j) {
      $('health').textContent = j.ok ? 'ok · ' + j.name + (j.db ? ' · db✓' : ' · db✗') : 'error'
      $('health').className = j.ok ? 'ok' : 'bad'
      if (j.ok && j.apis && j.apis.length) {
        $('apis').innerHTML = '<b>K2 已通 API（' + j.apis.length + ' 条）：</b><br>' +
          j.apis.map(function (a) { return '&nbsp;&nbsp;' + a }).join('<br>')
      }
    }).catch(function () { $('health').textContent = 'unreachable'; $('health').className = 'bad' })
  }
  function tickSession() {
    fetch('/s/api/auth/session').then(function (r) { return r.json() }).then(function (j) {
      $('session').textContent = j.authenticated ? (j.username || '已登录') : '未登录'
      $('session').className = j.authenticated ? 'ok' : 'dim'
      $('login').style.display = j.authenticated ? 'none' : 'block'
      if (j.authenticated) tickHeartbeat()
    })
  }
  function tickHeartbeat() {
    fetch('/s/api/heartbeat').then(function (r) { return r.json() }).then(function (j) {
      if (j.ok && j.latest) {
        $('heartbeat').textContent = '#' + j.latest.id + ' · ' + new Date(j.latest.created_at).toLocaleTimeString()
        $('heartbeat').className = 'ok'
      } else {
        $('heartbeat').textContent = j.ok ? '暂无' : (j.error || '不可用')
      }
    })
  }
  $('btn').onclick = function () {
    fetch('/s/api/auth/login', {
      method: 'POST', headers: { 'content-type': 'application/json' },
      body: JSON.stringify({ username: $('u').value, password: $('p').value }),
    }).then(function (r) { return r.json() }).then(function (j) {
      $('msg').textContent = j.ok ? '已登录' : (j.error || '登录失败')
      $('msg').className = j.ok ? 'ok' : 'bad'
      tickSession()
    })
  }
  tickHealth(); tickSession()
  setInterval(tickHealth, 15000)
</script>
</body>
</html>
